name: Release

# 推送 v* 标签（如 v1.0.2）时构建 Android 与 Windows 安装包并发布到 Releases；
# 也可以在 Actions 页面手动运行，只构建、不发布（安装包在运行结果的 Artifacts 里）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与本地开发使用的版本一致，保证构建结果可复现
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: 确定版本号
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' hitomi_reader/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # 标签必须与 pubspec.yaml 的版本一致，避免发布出版本号不对的安装包
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 pubspec.yaml 的版本 $VERSION 不一致"
              exit 1
            fi
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$VERSION-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hitomi_reader
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 写入发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::缺少签名密钥（仓库 Secrets：ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD），不能发布调试签名的安装包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-hitomiviewer}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - name: 检查签名
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::安装包使用的是调试签名"
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/HitomiViewer-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: hitomi_reader/dist/
          if-no-files-found: error

      - name: 清理签名文件
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hitomi_reader
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/HitomiViewer | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/HitomiViewer -Recurse
          Compress-Archive -Path dist/HitomiViewer -DestinationPath "dist/HitomiViewer-${{ needs.version.outputs.name }}-windows-x64.zip"
          Remove-Item dist/HitomiViewer -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: hitomi_reader/dist/
          if-no-files-found: error

  release:
    # 只有推送标签时才发布；手动运行到此为止
    if: github.ref_type == 'tag'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # 已经手动建好（写好了更新说明）的 Release 只上传安装包；否则自动生成更新说明
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "HitomiViewer $TAG" --generate-notes
          fi
